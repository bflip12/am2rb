name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, test and build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Check formatting
        run: scripts/format.sh --check

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Generate the test library
        run: scripts/make-test-library.sh "$RUNNER_TEMP/am2rb-test"

      - name: Run unit and end-to-end tests
        run: scripts/test.sh "$RUNNER_TEMP/am2rb-test"

      - name: Build the app bundle
        run: |
          scripts/build-app.sh
          ditto -c -k --keepParent build/am2rb.app build/am2rb.zip

      - name: Upload the app bundle
        uses: actions/upload-artifact@v4
        with:
          name: am2rb-${{ github.sha }}
          path: build/am2rb.zip
          retention-days: 14
