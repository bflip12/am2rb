name: Wrong or missed match
description: am2rb picked the wrong file, or didn't find a song that's in your DJ folder.
labels: [matching]
body:
  - type: markdown
    attributes:
      value: |
        Concrete examples are what make the matcher better. Please give the metadata exactly as it appears; there's no need to attach audio files.
  - type: textarea
    id: apple-music
    attributes:
      label: The song in Apple Music
      description: Title, artist and length, exactly as Apple Music shows them.
      placeholder: |
        Title: Track A
        Artist: Mr Fingers
        Length: 6:30
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: The file it should have matched
      description: Filename, title and artist tags, and length.
      placeholder: |
        File: House/Track A (Original Mix).mp3
        Title tag: Track A (Original Mix)
        Artist tag: Mr Fingers
        Length: 6:30
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What am2rb did instead
      description: The file it picked (with the same details) and its status (❓ or ❌), or "not found".
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: am2rb version or commit
