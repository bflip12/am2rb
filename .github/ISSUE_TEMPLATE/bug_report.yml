name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose DJ folder …
        2. Select playlist …
        3. …
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 26.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: am2rb version or commit
      description: The version in am2rb › About am2rb, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: input
    id: rekordbox
    attributes:
      label: Rekordbox version
      description: Only if the problem is with importing into Rekordbox.
  - type: textarea
    id: logs
    attributes:
      label: Error messages or logs
      render: text
